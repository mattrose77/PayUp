<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks for joining PayUp!</title>
<style>
  :root{
    --bg:#22211F; --surface:#2B2925; --text:#EDE7DA; --muted:#A9A398;
    --accent:#C4F82A; --border:#3A3833;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
  }
  .wordmark{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; margin-bottom:24px; }
  .wordmark .dot{ width:9px; height:9px; border-radius:2px; background:var(--accent); }
  h1{ font-size:20px; margin:0 0 12px; }
  p{ color:var(--muted); font-size:14px; margin:0 0 12px; line-height:1.55; }
  p:last-child{ margin-bottom:0; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="dot"></span>PayUp</div>
    <h1 id="heading">Thanks for joining PayUp!</h1>
    <p id="line1">You've confirmed your account — head back to the app and sign in.</p>
    <p id="line2">You can close this tab now.</p>
  </div>

  <script>
    (function(){
      function getParam(name){
        var query = new URLSearchParams(window.location.search);
        if (query.has(name)) return query.get(name);
        var hash = window.location.hash.indexOf('#') === 0 ? window.location.hash.slice(1) : window.location.hash;
        return new URLSearchParams(hash).get(name);
      }

      var type = getParam('type');
      var heading = document.getElementById('heading');
      var line1 = document.getElementById('line1');
      var line2 = document.getElementById('line2');

      // Password reset links now use the payup:// custom scheme directly, so they
      // never land on this page on a working setup — this page's default copy
      // (above) is for the sign-up confirmation link, which still redirects here.
      // The only other case worth covering is a stale/reused link.
      if (type === 'recovery'){
        heading.textContent = "Open this on your phone";
        line1.textContent = "Password reset links only work on the phone where PayUp is installed — the app opens automatically when you tap the link there.";
        line2.textContent = "Open the email on your phone instead, or, if the link's gone stale, go back to PayUp's sign-in screen to request a new one.";
      }
    })();
  </script>
</body>
</html>
